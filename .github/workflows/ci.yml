        env:
          CHECKS_STATUS: ${{ needs.checks_thirteen.result }}
          RUNTIME_STATUS: ${{ needs.runtime_thirteen.result }}
        run: |
          uv run python scripts/ci_validation.py verify --python 3.13 \
            --evidence-dir "$RUNNER_TEMP/coverage-reports" \
            --checks-status "$CHECKS_STATUS" --runtime-status "$RUNTIME_STATUS"

  target_conformance:
    name: Target ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - postgres
          - mysql
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          enable-cache: false
          prune-cache: true
      - name: Configure target environment
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/pietto-target-venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/pietto-target-uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"
      - name: Install locked target environment
        run: uv sync --locked
      - name: Run isolated target conformance
        run: |
          uv run python tests/_pietto_target_conformance.py run \
            --target "$TARGET" --pins tests/phase66_target_pins.json \
            --evidence-dir "$RUNNER_TEMP/phase66-target/$TARGET" \
            --expected-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload exact target receipt
        if: always()
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/phase66-target/${{ matrix.target }}/phase66-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}.json
          archive: false
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 1
      - name: Verify uploaded receipt bytes
        if: always()
        env:
          ARTIFACT_DIGEST: ${{ steps.receipt.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          uv run python tests/_pietto_target_conformance.py verify-receipts \
            --target "$TARGET" --pins tests/phase66_target_pins.json \
            --evidence-dir "$RUNNER_TEMP/phase66-target/$TARGET" \
            --expected-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --artifact-digest "$ARTIFACT_DIGEST" --artifact-id "$ARTIFACT_ID"

  target_conformance_aggregate:
    name: Target conformance aggregate
    needs: [python_twelve, python_thirteen, target_conformance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          enable-cache: false
          prune-cache: true
      - name: Configure receipt environment
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/pietto-receipt-venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/pietto-receipt-uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"
      - name: Install locked receipt environment
        run: uv sync --locked
      - name: Download PostgreSQL receipt from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phase66-postgres-${{ github.run_id }}-${{ github.run_attempt }}.json
          path: ${{ runner.temp }}/phase66-receipts/postgres
          skip-decompress: true
          digest-mismatch: error
      - name: Download MySQL receipt from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phase66-mysql-${{ github.run_id }}-${{ github.run_attempt }}.json
          path: ${{ runner.temp }}/phase66-receipts/mysql
          skip-decompress: true
          digest-mismatch: error
      - name: Verify all required conformance outcomes
        env:
          COMPILER_STATUS: ${{ needs.python_twelve.result == 'success' && needs.python_thirteen.result == 'success' && 'success' || 'failure' }}
          TARGET_STATUS: ${{ needs.target_conformance.result }}
        run: |
          uv run python tests/_pietto_target_conformance.py verify-receipts \
            --pins tests/phase66_target_pins.json \
            --evidence-dir "$RUNNER_TEMP/phase66-receipts" \
            --expected-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --compiler-status "$COMPILER_STATUS" --target-status "$TARGET_STATUS"
