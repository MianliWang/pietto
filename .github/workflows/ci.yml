name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    env:
      UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/pietto-venv
      UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
          overwrite-settings: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.19"
          enable-cache: false

      - name: Install locked environment
        run: uv sync --locked

      - name: Run authoritative validation
        run: uv run python scripts/validate.py

      - name: Verify generated files
        run: uv run python scripts/check_generated.py

      - name: Audit golden fixtures
        run: uv run python scripts/check_goldens.py

      - name: Smoke test installed package
        run: uv run python scripts/package_smoke.py
