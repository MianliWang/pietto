name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          overwrite-settings: false
          verify-signature: true

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          enable-cache: false
          prune-cache: true

      - name: Configure uv paths
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/pietto-venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"

      - name: Install locked environment
        run: uv sync --locked

      - name: Verify matrix interpreter
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          "$pythonLocation/bin/python" - <<'PY'
          import platform
          import sys

          print(f"setup-python interpreter: {sys.executable}")
          print(
              "setup-python version: "
              f"{platform.python_implementation()} {platform.python_version()}"
          )
          PY

          uv run python - <<'PY'
          import os
          import platform
          import sys

          expected = tuple(map(int, os.environ["EXPECTED_PYTHON"].split(".")))
          actual = sys.version_info[:2]

          print(f"uv interpreter: {sys.executable}")
          print(
              "uv Python: "
              f"{platform.python_implementation()} {platform.python_version()}"
          )
          print(
              "uv/package-smoke interpreter: "
              f"{sys.executable} Python {platform.python_version()}"
          )

          if actual != expected:
              raise SystemExit(
                  f"expected Python {expected[0]}.{expected[1]}, "
                  f"got {actual[0]}.{actual[1]}"
              )
          PY

      - name: Run authoritative validation
        run: uv run python scripts/validate.py --timings

      - name: Verify generated files
        run: uv run python scripts/check_generated.py

      - name: Audit golden fixtures
        run: uv run python scripts/check_goldens.py

      - name: Smoke test installed package
        run: uv run python scripts/package_smoke.py

  target_conformance:
    name: Target ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - postgres
          - mysql
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          enable-cache: false
          prune-cache: true
      - name: Configure target environment
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/pietto-target-venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/pietto-target-uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"
      - name: Install locked target environment
        run: uv sync --locked
      - name: Run isolated target conformance
        run: |
          uv run python tests/_pietto_target_conformance.py run \
            --target "$TARGET" --pins tests/phase66_target_pins.json \
            --evidence-dir "$RUNNER_TEMP/phase66-target/$TARGET" \
            --expected-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload exact target receipt
        if: always()
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/phase66-target/${{ matrix.target }}/phase66-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}.json
          archive: false
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 1
      - name: Verify uploaded receipt bytes
        if: always()
        env:
          ARTIFACT_DIGEST: ${{ steps.receipt.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          uv run python tests/_pietto_target_conformance.py verify-receipts \
            --target "$TARGET" --pins tests/phase66_target_pins.json \
            --evidence-dir "$RUNNER_TEMP/phase66-target/$TARGET" \
            --expected-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --artifact-digest "$ARTIFACT_DIGEST" --artifact-id "$ARTIFACT_ID"

  target_conformance_aggregate:
    name: Target conformance aggregate
    needs: [validation, target_conformance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          enable-cache: false
          prune-cache: true
      - name: Configure receipt environment
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/pietto-receipt-venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/pietto-receipt-uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"
      - name: Install locked receipt environment
        run: uv sync --locked
      - name: Download PostgreSQL receipt from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phase66-postgres-${{ github.run_id }}-${{ github.run_attempt }}.json
          path: ${{ runner.temp }}/phase66-receipts/postgres
          skip-decompress: true
          digest-mismatch: error
      - name: Download MySQL receipt from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phase66-mysql-${{ github.run_id }}-${{ github.run_attempt }}.json
          path: ${{ runner.temp }}/phase66-receipts/mysql
          skip-decompress: true
          digest-mismatch: error
      - name: Verify all required conformance outcomes
        env:
          COMPILER_STATUS: ${{ needs.validation.result }}
          TARGET_STATUS: ${{ needs.target_conformance.result }}
        run: |
          uv run python tests/_pietto_target_conformance.py verify-receipts \
            --pins tests/phase66_target_pins.json \
            --evidence-dir "$RUNNER_TEMP/phase66-receipts" \
            --expected-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --compiler-status "$COMPILER_STATUS" --target-status "$TARGET_STATUS"
