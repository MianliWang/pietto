name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          overwrite-settings: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.19"
          enable-cache: false

      - name: Configure uv paths
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/pietto-venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"

      - name: Install locked environment
        run: uv sync --locked

      - name: Verify matrix interpreter
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          "$pythonLocation/bin/python" - <<'PY'
          import platform
          import sys

          print(f"setup-python interpreter: {sys.executable}")
          print(
              "setup-python version: "
              f"{platform.python_implementation()} {platform.python_version()}"
          )
          PY

          uv run python - <<'PY'
          import os
          import platform
          import sys

          expected = tuple(map(int, os.environ["EXPECTED_PYTHON"].split(".")))
          actual = sys.version_info[:2]

          print(f"uv interpreter: {sys.executable}")
          print(
              "uv Python: "
              f"{platform.python_implementation()} {platform.python_version()}"
          )
          print(
              "uv/package-smoke interpreter: "
              f"{sys.executable} Python {platform.python_version()}"
          )

          if actual != expected:
              raise SystemExit(
                  f"expected Python {expected[0]}.{expected[1]}, "
                  f"got {actual[0]}.{actual[1]}"
              )
          PY

      - name: Run authoritative validation
        run: uv run python scripts/validate.py --timings --pytest-workers auto --pytest-dist loadfile --pytest-maxprocesses 4

      - name: Verify generated files
        run: uv run python scripts/check_generated.py

      - name: Audit golden fixtures
        run: uv run python scripts/check_goldens.py

      - name: Smoke test installed package
        run: uv run python scripts/package_smoke.py
