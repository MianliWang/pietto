name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          overwrite-settings: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          enable-cache: false
          prune-cache: true

      - name: Configure uv paths
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/pietto-venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"

      - name: Install locked environment
        run: uv sync --locked

      - name: Verify matrix interpreter
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          "$pythonLocation/bin/python" - <<'PY'
          import platform
          import sys

          print(f"setup-python interpreter: {sys.executable}")
          print(
              "setup-python version: "
              f"{platform.python_implementation()} {platform.python_version()}"
          )
          PY

          uv run python - <<'PY'
          import os
          import platform
          import sys

          expected = tuple(map(int, os.environ["EXPECTED_PYTHON"].split(".")))
          actual = sys.version_info[:2]

          print(f"uv interpreter: {sys.executable}")
          print(
              "uv Python: "
              f"{platform.python_implementation()} {platform.python_version()}"
          )
          print(
              "uv/package-smoke interpreter: "
              f"{sys.executable} Python {platform.python_version()}"
          )

          if actual != expected:
              raise SystemExit(
                  f"expected Python {expected[0]}.{expected[1]}, "
                  f"got {actual[0]}.{actual[1]}"
              )
          PY

      - name: Run authoritative validation
        run: uv run python scripts/validate.py --timings

      - name: Verify generated files
        run: uv run python scripts/check_generated.py

      - name: Audit golden fixtures
        run: uv run python scripts/check_goldens.py

      - name: Smoke test installed package
        run: uv run python scripts/package_smoke.py
