          overwrite-settings: false
          verify-signature: true
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          enable-cache: false
          prune-cache: true
      - name: Configure isolated interpreter environment
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/pietto-venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"
      - name: Install locked environment
        run: uv sync --locked
      - name: Run complete selected runtime partition
        run: |
          uv run python scripts/ci_validation.py run --python 3.13 --partition ${{ matrix.partition }} \
            --report "$RUNNER_TEMP/coverage-reports/ci-coverage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.13-${{ matrix.partition }}.json"
      - name: Upload exact coverage report
        if: always()
        id: coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.13-${{ matrix.partition }}.json
          path: ${{ runner.temp }}/coverage-reports/ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.13-${{ matrix.partition }}.json
          archive: false
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 1
      - name: Verify raw coverage artifact identity
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.coverage.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.coverage.outputs.artifact-digest }}
        run: |
          uv run python scripts/ci_validation.py artifact --python 3.13 \
            --report "$RUNNER_TEMP/coverage-reports/ci-coverage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.13-${{ matrix.partition }}.json" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"

  python_thirteen:
    name: Python 3.13
    needs: [checks_thirteen, runtime_thirteen]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          enable-cache: false
          prune-cache: true
      - name: Configure isolated interpreter environment
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/pietto-venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"
      - name: Install locked environment
        run: uv sync --locked
      - name: Download collection coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.13-collection.json
          path: ${{ runner.temp }}/coverage-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download matrix coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.13-matrix.json
          path: ${{ runner.temp }}/coverage-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download standalone coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.13-standalone.json
          path: ${{ runner.temp }}/coverage-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download remaining coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.13-remaining.json
          path: ${{ runner.temp }}/coverage-reports
          skip-decompress: true
          digest-mismatch: error
