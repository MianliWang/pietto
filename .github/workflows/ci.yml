name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks_twelve:
    name: Compiler / Package 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          overwrite-settings: false
          verify-signature: true
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          enable-cache: false
          prune-cache: true
      - name: Configure isolated interpreter environment
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/pietto-venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"
      - name: Install locked environment
        run: uv sync --locked
      - name: Run explicit static gates
        run: uv run python scripts/ci_validation.py gates --python 3.12 --common
      - name: Verify generated files
        run: uv run python scripts/check_generated.py
      - name: Audit golden fixtures
        run: uv run python scripts/check_goldens.py
      - name: Smoke test installed package
        run: uv run python scripts/package_smoke.py
      - name: Run real isolated Arrow readiness experiment
        run: |
          uv venv --python "$pythonLocation/bin/python" "$RUNNER_TEMP/arrow-ready"
          uv pip install --python "$RUNNER_TEMP/arrow-ready/bin/python" --require-hashes --only-binary :all: --no-deps -r ci/phase67-arrow-compatibility-requirements.txt
          "$RUNNER_TEMP/arrow-ready/bin/python" tests/_pietto_phase67_arrow_compatibility_probe.py --report "$RUNNER_TEMP/arrow-reports/arrow-readiness-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.12.json"
          uv run python scripts/ci_validation.py check-arrow --python 3.12 --report "$RUNNER_TEMP/arrow-reports/arrow-readiness-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.12.json"
      - name: Upload exact Arrow readiness
        if: always()
        id: readiness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arrow-readiness-${{ github.run_id }}-${{ github.run_attempt }}-3.12.json
          path: ${{ runner.temp }}/arrow-reports/arrow-readiness-${{ github.run_id }}-${{ github.run_attempt }}-3.12.json
          archive: false
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 1
      - name: Verify raw Arrow readiness identity
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.readiness.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.readiness.outputs.artifact-digest }}
        run: |
          uv run python scripts/ci_validation.py artifact --python 3.12 \
            --report "$RUNNER_TEMP/arrow-reports/arrow-readiness-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.12.json" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"
      - name: Collect independent full node inventory
        run: |
          uv run python scripts/ci_validation.py collect --python 3.12 \
            --report "$RUNNER_TEMP/coverage-reports/ci-coverage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.12-collection.json"
      - name: Upload exact coverage report
        if: always()
        id: coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.12-collection.json
          path: ${{ runner.temp }}/coverage-reports/ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.12-collection.json
          archive: false
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 1
      - name: Verify raw coverage artifact identity
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.coverage.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.coverage.outputs.artifact-digest }}
        run: |
          uv run python scripts/ci_validation.py artifact --python 3.12 \
            --report "$RUNNER_TEMP/coverage-reports/ci-coverage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.12-collection.json" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"

  runtime_twelve:
    name: Runtime 3.12 / ${{ matrix.partition }}
    strategy:
      fail-fast: false
      matrix:
        partition:
          - shared-acquisition
          - plan-portability
          - emission-portability
          - general-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          overwrite-settings: false
          verify-signature: true
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          enable-cache: false
          prune-cache: true
      - name: Configure isolated interpreter environment
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/pietto-venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"
      - name: Install locked environment
        run: uv sync --locked
      - name: Run complete selected runtime partition
        run: |
          uv run python scripts/ci_validation.py run --python 3.12 --partition ${{ matrix.partition }} \
            --report "$RUNNER_TEMP/coverage-reports/ci-coverage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.12-${{ matrix.partition }}.json" \
            --health "$RUNNER_TEMP/health-reports/ci-health-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.12-${{ matrix.partition }}.json"
      - name: Upload exact coverage report
        if: always()
        id: coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.12-${{ matrix.partition }}.json
          path: ${{ runner.temp }}/coverage-reports/ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.12-${{ matrix.partition }}.json
          archive: false
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 1
      - name: Verify raw coverage artifact identity
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.coverage.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.coverage.outputs.artifact-digest }}
        run: |
          uv run python scripts/ci_validation.py artifact --python 3.12 \
            --report "$RUNNER_TEMP/coverage-reports/ci-coverage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.12-${{ matrix.partition }}.json" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"
      - name: Upload exact partition health
        if: always()
        id: health
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-health-${{ github.run_id }}-${{ github.run_attempt }}-3.12-${{ matrix.partition }}.json
          path: ${{ runner.temp }}/health-reports/ci-health-${{ github.run_id }}-${{ github.run_attempt }}-3.12-${{ matrix.partition }}.json
          archive: false
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 30
      - name: Verify raw partition health identity
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.health.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.health.outputs.artifact-digest }}
        run: |
          uv run python scripts/ci_validation.py artifact --python 3.12 \
            --report "$RUNNER_TEMP/health-reports/ci-health-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.12-${{ matrix.partition }}.json" --evidence-dir "$RUNNER_TEMP/coverage-reports" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"

  python_twelve:
    name: Python 3.12
    needs: [checks_twelve, runtime_twelve]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          enable-cache: false
          prune-cache: true
      - name: Configure isolated interpreter environment
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/pietto-venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"
      - name: Install locked environment
        run: uv sync --locked
      - name: Download collection coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.12-collection.json
          path: ${{ runner.temp }}/coverage-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download shared-acquisition coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.12-shared-acquisition.json
          path: ${{ runner.temp }}/coverage-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download plan-portability coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.12-plan-portability.json
          path: ${{ runner.temp }}/coverage-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download emission-portability coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.12-emission-portability.json
          path: ${{ runner.temp }}/coverage-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download general-runtime coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.12-general-runtime.json
          path: ${{ runner.temp }}/coverage-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download shared-acquisition health report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-health-${{ github.run_id }}-${{ github.run_attempt }}-3.12-shared-acquisition.json
          path: ${{ runner.temp }}/health-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download plan-portability health report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-health-${{ github.run_id }}-${{ github.run_attempt }}-3.12-plan-portability.json
          path: ${{ runner.temp }}/health-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download emission-portability health report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-health-${{ github.run_id }}-${{ github.run_attempt }}-3.12-emission-portability.json
          path: ${{ runner.temp }}/health-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download general-runtime health report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-health-${{ github.run_id }}-${{ github.run_attempt }}-3.12-general-runtime.json
          path: ${{ runner.temp }}/health-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download required Arrow readiness
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arrow-readiness-${{ github.run_id }}-${{ github.run_attempt }}-3.12.json
          path: ${{ runner.temp }}/arrow-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Require successful jobs and reconcile complete coverage
        env:
          CHECKS_STATUS: ${{ needs.checks_twelve.result }}
          RUNTIME_STATUS: ${{ needs.runtime_twelve.result }}
        run: |
          uv run python scripts/ci_validation.py verify --python 3.12 \
            --evidence-dir "$RUNNER_TEMP/coverage-reports" \
            --health-dir "$RUNNER_TEMP/health-reports" --readiness "$RUNNER_TEMP/arrow-reports/arrow-readiness-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.12.json" \
            --summary "$RUNNER_TEMP/completion/ci-health-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.12-summary.json" \
            --checks-status "$CHECKS_STATUS" --runtime-status "$RUNTIME_STATUS"
      - name: Upload complete runtime health
        if: always()
        id: completion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-health-${{ github.run_id }}-${{ github.run_attempt }}-3.12-summary.json
          path: ${{ runner.temp }}/completion/ci-health-${{ github.run_id }}-${{ github.run_attempt }}-3.12-summary.json
          archive: false
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 30
      - name: Verify raw runtime health identity
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.completion.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.completion.outputs.artifact-digest }}
        run: |
          uv run python scripts/ci_validation.py artifact --python 3.12 \
            --report "$RUNNER_TEMP/completion/ci-health-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.12-summary.json" \
