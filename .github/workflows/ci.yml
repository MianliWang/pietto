        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-health-${{ github.run_id }}-${{ github.run_attempt }}-3.13-${{ matrix.partition }}.json
          path: ${{ runner.temp }}/health-reports/ci-health-${{ github.run_id }}-${{ github.run_attempt }}-3.13-${{ matrix.partition }}.json
          archive: false
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 30
      - name: Verify raw partition health identity
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.health.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.health.outputs.artifact-digest }}
        run: |
          uv run python scripts/ci_validation.py artifact --python 3.13 \
            --report "$RUNNER_TEMP/health-reports/ci-health-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.13-${{ matrix.partition }}.json" --evidence-dir "$RUNNER_TEMP/coverage-reports" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"

  python_thirteen:
    name: Python 3.13
    needs: [checks_thirteen, runtime_thirteen]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          enable-cache: false
          prune-cache: true
      - name: Configure isolated interpreter environment
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/pietto-venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"
      - name: Install locked environment
        run: uv sync --locked
      - name: Download collection coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.13-collection.json
          path: ${{ runner.temp }}/coverage-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download shared-acquisition coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.13-shared-acquisition.json
          path: ${{ runner.temp }}/coverage-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download plan-portability coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.13-plan-portability.json
          path: ${{ runner.temp }}/coverage-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download emission-portability coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.13-emission-portability.json
          path: ${{ runner.temp }}/coverage-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download general-runtime coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.13-general-runtime.json
          path: ${{ runner.temp }}/coverage-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download shared-acquisition health report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-health-${{ github.run_id }}-${{ github.run_attempt }}-3.13-shared-acquisition.json
          path: ${{ runner.temp }}/health-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download plan-portability health report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-health-${{ github.run_id }}-${{ github.run_attempt }}-3.13-plan-portability.json
          path: ${{ runner.temp }}/health-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download emission-portability health report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-health-${{ github.run_id }}-${{ github.run_attempt }}-3.13-emission-portability.json
          path: ${{ runner.temp }}/health-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download general-runtime health report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-health-${{ github.run_id }}-${{ github.run_attempt }}-3.13-general-runtime.json
          path: ${{ runner.temp }}/health-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Download required Arrow readiness
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arrow-readiness-${{ github.run_id }}-${{ github.run_attempt }}-3.13.json
          path: ${{ runner.temp }}/arrow-reports
          skip-decompress: true
          digest-mismatch: error
      - name: Require successful jobs and reconcile complete coverage
        env:
          CHECKS_STATUS: ${{ needs.checks_thirteen.result }}
          RUNTIME_STATUS: ${{ needs.runtime_thirteen.result }}
        run: |
          uv run python scripts/ci_validation.py verify --python 3.13 \
            --evidence-dir "$RUNNER_TEMP/coverage-reports" \
            --health-dir "$RUNNER_TEMP/health-reports" --readiness "$RUNNER_TEMP/arrow-reports/arrow-readiness-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.13.json" \
            --summary "$RUNNER_TEMP/completion/ci-health-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.13-summary.json" \
            --checks-status "$CHECKS_STATUS" --runtime-status "$RUNTIME_STATUS"
      - name: Upload complete runtime health
        if: always()
        id: completion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-health-${{ github.run_id }}-${{ github.run_attempt }}-3.13-summary.json
          path: ${{ runner.temp }}/completion/ci-health-${{ github.run_id }}-${{ github.run_attempt }}-3.13-summary.json
          archive: false
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 30
      - name: Verify raw runtime health identity
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.completion.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.completion.outputs.artifact-digest }}
        run: |
          uv run python scripts/ci_validation.py artifact --python 3.13 \
            --report "$RUNNER_TEMP/completion/ci-health-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.13-summary.json" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"

  target_conformance:
    name: Target ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - postgres
          - mysql
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          enable-cache: false
          prune-cache: true
      - name: Configure target environment
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/pietto-target-venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/pietto-target-uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"
      - name: Install locked target environment
        run: uv sync --locked
      - name: Run isolated target conformance
        run: |
          uv run python tests/_pietto_target_conformance.py run \
            --target "$TARGET" --pins tests/phase66_target_pins.json \
            --evidence-dir "$RUNNER_TEMP/phase66-target/$TARGET" \
            --expected-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload exact target receipt
        if: always()
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/phase66-target/${{ matrix.target }}/phase66-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}.json
          archive: false
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 1
      - name: Verify uploaded receipt bytes
        if: always()
        env:
          ARTIFACT_DIGEST: ${{ steps.receipt.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          uv run python tests/_pietto_target_conformance.py verify-receipts \
            --target "$TARGET" --pins tests/phase66_target_pins.json \
            --evidence-dir "$RUNNER_TEMP/phase66-target/$TARGET" \
            --expected-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --artifact-digest "$ARTIFACT_DIGEST" --artifact-id "$ARTIFACT_ID"

  target_conformance_aggregate:
    name: Target conformance aggregate
    needs: [python_twelve, python_thirteen, target_conformance]
    if: always()
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          enable-cache: false
          prune-cache: true
      - name: Configure receipt environment
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/pietto-receipt-venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/pietto-receipt-uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON=$pythonLocation/bin/python" >> "$GITHUB_ENV"
      - name: Install locked receipt environment
        run: uv sync --locked
      - name: Download PostgreSQL receipt from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phase66-postgres-${{ github.run_id }}-${{ github.run_attempt }}.json
          path: ${{ runner.temp }}/phase66-receipts/postgres
          skip-decompress: true
          digest-mismatch: error
      - name: Download MySQL receipt from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phase66-mysql-${{ github.run_id }}-${{ github.run_attempt }}.json
          path: ${{ runner.temp }}/phase66-receipts/mysql
          skip-decompress: true
          digest-mismatch: error
      - name: Verify all required conformance outcomes
        env:
          COMPILER_STATUS: ${{ needs.python_twelve.result == 'success' && needs.python_thirteen.result == 'success' && 'success' || 'failure' }}
          TARGET_STATUS: ${{ needs.target_conformance.result }}
        run: |
          uv run python tests/_pietto_target_conformance.py verify-receipts \
            --pins tests/phase66_target_pins.json \
            --evidence-dir "$RUNNER_TEMP/phase66-receipts" \
            --expected-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --compiler-status "$COMPILER_STATUS" --target-status "$TARGET_STATUS"
      - name: Report workload health and bounded trusted history
        env:
          CI_HEALTH_TOKEN: ${{ github.token }}
          COMPILER_STATUS: ${{ needs.python_twelve.result == 'success' && needs.python_thirteen.result == 'success' && 'success' || 'failure' }}
          TARGET_STATUS: ${{ needs.target_conformance.result }}
        run: |
          uv run python scripts/ci_validation.py health --python 3.13 \
            --health-dir "$RUNNER_TEMP/health-completions" \
            --report "$RUNNER_TEMP/health-summary/ci-health-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-summary.json" \
            --compiler-status "$COMPILER_STATUS" --target-status "$TARGET_STATUS"
      - name: Upload current workload health
        if: always()
        id: health
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-health-${{ github.run_id }}-${{ github.run_attempt }}-summary.json
          path: ${{ runner.temp }}/health-summary/ci-health-${{ github.run_id }}-${{ github.run_attempt }}-summary.json
          archive: false
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 30
      - name: Verify raw workload health identity
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.health.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.health.outputs.artifact-digest }}
        run: |
          uv run python scripts/ci_validation.py artifact --python 3.13 \
            --report "$RUNNER_TEMP/health-summary/ci-health-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-summary.json" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"
