      - name: Run explicit static gates
        run: uv run python scripts/ci_validation.py gates --python 3.13
      - name: Verify generated files
        run: uv run python scripts/check_generated.py
      - name: Audit golden fixtures
        run: uv run python scripts/check_goldens.py
      - name: Smoke test installed package
        run: uv run python scripts/package_smoke.py
      - name: Collect independent full node inventory
        run: |
          uv run python scripts/ci_validation.py collect --python 3.13 \
            --report "$RUNNER_TEMP/coverage-reports/ci-coverage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.13-collection.json"
      - name: Upload exact coverage report
        if: always()
        id: coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.13-collection.json
          path: ${{ runner.temp }}/coverage-reports/ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}-3.13-collection.json
          archive: false
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 1
      - name: Verify raw coverage artifact identity
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.coverage.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.coverage.outputs.artifact-digest }}
        run: |
          uv run python scripts/ci_validation.py artifact --python 3.13 \
            --report "$RUNNER_TEMP/coverage-reports/ci-coverage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.13-collection.json" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"

  runtime_thirteen:
    name: Runtime 3.13 (${{ matrix.partition }})
    strategy:
      fail-fast: false
      matrix:
        partition:
          - matrix
          - standalone
          - remaining
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
