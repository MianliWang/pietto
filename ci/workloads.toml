version = 1
topology_version = 2

[thresholds]
imbalance_watch = 1.25
imbalance_review = 1.50
finish_spread = 0.30
startup = 0.25
long_node_fraction = 0.40
long_node_seconds = 60.0
critical_path_growth = 0.25
runner_sum_growth = 0.20
minimum_wall_gain = 0.15

[[requirements]]
kind = "general-runtime"
family = "default"
acquisition_group = ""
dependency_profile = "core"

[[requirements]]
kind = "shared-acquisition"
family = "compiler-differential"
acquisition_group = "compiler-differential"
dependency_profile = "core"

[[requirements]]
kind = "process-portability"
family = "plan"
acquisition_group = ""
dependency_profile = "core"

[[requirements]]
kind = "process-portability"
family = "emission"
acquisition_group = ""
dependency_profile = "core"

# A placement listing several shards deals that requirement's sorted nodes to
# them in turn (node i goes to shards[i % n]); acquisition groups keep one shard.
[[placements]]
kind = "general-runtime"
family = "default"
shards = ["general-runtime-1", "general-runtime-2", "general-runtime-3"]

[[placements]]
kind = "shared-acquisition"
family = "compiler-differential"
shards = ["shared-acquisition"]

[[placements]]
kind = "process-portability"
family = "plan"
shards = ["plan-portability"]

[[placements]]
kind = "process-portability"
family = "emission"
shards = ["emission-portability"]

[[shards]]
id = "shared-acquisition"
scheduler = "loadfile"
dependency_profile = "core"

[[shards]]
id = "plan-portability"
scheduler = "load"
dependency_profile = "core"

[[shards]]
id = "emission-portability"
scheduler = "load"
dependency_profile = "core"

[[shards]]
id = "general-runtime-1"
scheduler = "loadfile"
dependency_profile = "core"

[[shards]]
id = "general-runtime-2"
scheduler = "loadfile"
dependency_profile = "core"

[[shards]]
id = "general-runtime-3"
scheduler = "loadfile"
dependency_profile = "core"

