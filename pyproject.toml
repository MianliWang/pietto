[project]
name = "pietto"
version = "0.1.0"
description = "A gradual, semantic SQL authoring DSL"
readme = "README.md"
authors = [
    { name = "Mianli Wang", email = "mianli.wang@mail.utoronto.ca" }
]
requires-python = ">=3.12"
dependencies = [
    "antlr4-python3-runtime>=4.13.2",
]

[project.scripts]
pietto = "pietto.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.3",
]

[tool.ruff]
extend-exclude = ["src/pietto/generated", "*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
