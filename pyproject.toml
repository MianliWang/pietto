[project]
name = "pietto"
version = "0.1.0"
description = "A gradual, semantic SQL authoring DSL"
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "LICENSES/ANTLR-4.13.2.txt",
    "LICENSES/ANTLR-4.13.2-Python3-template-header.txt",
    "LICENSES/pgvector-0.8.6.txt",
    "LICENSES/PostgreSQL-18.6.txt",
    "LICENSES/SOURCES.md",
]
authors = [
    { name = "Mianli Wang", email = "mianli.wang@mail.utoronto.ca" }
]
requires-python = ">=3.12"
dependencies = [
    "antlr4-python3-runtime==4.13.2",
]

[project.optional-dependencies]
arrow = [
    "pyarrow==25.0.1",
]
execute-postgres = [
    "pyarrow==25.0.1",
    "psycopg[binary]==3.3.5",
]
execute-mysql = [
    "pyarrow==25.0.1",
    "mysql-connector-python==26.7.0",
]
execute-postgres-adbc = [
    "pyarrow==25.0.1",
    "adbc-driver-postgresql==1.12.0",
    "adbc-driver-manager==1.12.0",
]

[project.scripts]
pietto = "pietto.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
target-conformance = [
    "psycopg[binary]==3.3.5",
    "mysql-connector-python==26.7.0",
]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.3",
    { include-group = "target-conformance" },
]

[tool.ruff]
extend-exclude = ["src/pietto/generated", "*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
