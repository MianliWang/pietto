[project]
name = "pietto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mianli Wang", email = "mianli.wang@mail.utoronto.ca" }
]
requires-python = ">=3.12"
dependencies = [
    "antlr4-python3-runtime>=4.13.2",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "sqlglot>=30.9.0",
    "typer>=0.26.7",
]

[project.scripts]
pietto = "pietto:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]
